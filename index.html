<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>НАУКА: Архитектура смыслов</title>
    <style>
        :root {
            --accent: #b34a33;
            --transition: 350ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        body { 
            margin: 0; background: #fafafa; 
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            overflow: hidden; height: 100vh; width: 100vw;
            user-select: none; -webkit-user-select: none;
            -webkit-user-select: none;  /* Safari */
            -moz-user-select: none;     /* Firefox */
            -ms-user-select: none;      /* IE10+ */
            user-select: none;          /* Стандарт */
        }

        /* Панель управления слоями (Слева) */
        .sidebar { 
            position: absolute; top: 20px; left: 20px; width: 240px; 
            background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 12px; padding: 18px; z-index: 1000; 
            box-shadow: 0 4px 25px rgba(0,0,0,0.06);
            border: 1px solid rgba(0,0,0,0.05);
        }

        .sidebar h3 { color: var(--accent); text-transform: uppercase; font-size: 11px; margin: 0 0 14px 0; letter-spacing: 1px; font-weight: 700; }

        .filter-group { display: flex; flex-direction: column; gap: 10px; }
        .filter-item { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: #222; cursor: pointer; user-select: none; font-weight: 500; }
        .filter-item input { accent-color: var(--accent); cursor: pointer; width: 16px; height: 16px; margin: 0; }

        /* Полоска небольшого плавного зума */
        .zoom-controls {
            margin-top: 14px; padding-top: 12px;
            border-top: 1px solid rgba(0,0,0,0.08);
            display: flex; align-items: center; gap: 10px;
        }
        .zoom-controls span { font-size: 11px; color: #666; font-weight: bold; width: 35px; text-align: right; }
        .zoom-slider {
            flex: 1; -webkit-appearance: none; appearance: none;
            height: 4px; background: #ddd; border-radius: 2px; outline: none;
        }
        .zoom-slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer;
            transition: transform 100ms;
        }
        .zoom-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }

        /* Карточка информации — В ПРАВУЮ СТОРОНУ И ВО ВСЮ ВЫСОТУ ЭКРАНА */
        .info-box {
            position: absolute; top: 0; right: 0; width: 320px; height: 100vh;
            background: #ffffff; z-index: 1000;
            box-shadow: -5px 0 40px rgba(0,0,0,0.06);
            border-left: 1px solid rgba(0,0,0,0.08);
            box-sizing: border-box;
            padding: 30px 24px;
            display: none;
            overflow-y: auto;
        }

        /* Вывод картинки строго в изначальном квадратном соотношении 1:1 */
        .info-image-container {
            margin: 0 0 20px 0;
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 12px;
            background: #f3f3f3;
            border: 1px solid rgba(0,0,0,0.04);
        }
        
        .info-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .info-box h2 { font-size: 16px; margin: 0 0 12px 0; color: #111; letter-spacing: 0.3px; font-weight: 700; text-transform: uppercase; line-height: 1.3; }
        .info-box p { font-size: 13px; color: #444; line-height: 1.6; margin: 0; text-align: justify; }

        /* Контейнер интерактивной карты (Бесконечный холст в стиле Figma) */
        .map-container {
            width: 100vw; height: 100vh;
            position: relative; background: #fafafa;
            overflow: hidden; cursor: grab;
            display: flex; align-items: center; justify-content: center;
        }
        .map-container:active { cursor: grabbing; }

        /* Слой карты со 100% сохранением векторной четкости */
        svg { 
            width: 100%; height: 100%; position: absolute; top: 0; left: 0;
            max-width: 100vw; max-height: 100vh;
            display: block;
            shape-rendering: geometricPrecision;
            text-rendering: geometricPrecision;
            cursor: grab; -webkit-tap-highlight-color: transparent;
            touch-action: none; /* ОБЯЗАТЕЛЬНО: отключает нативный зум и скролл браузера */

        }

        /* Интерактивные стили для элементов SVG карты */
        svg [id] {
            transition: fill var(--transition), stroke var(--transition), opacity var(--transition), stroke-width var(--transition);
        }

        svg [id]:hover {
            filter: brightness(0.96);
        }

        /* Жесткое затухание для всех остальных улиц, полигонов и лейблов */
        svg .dimmed { 
            opacity: 0.12 !important; 
        }
        
        /* Выбранная активная улица и её лейбл полностью игнорируют затухание */
        svg .highlight { 
            opacity: 1 !important; 
        }
        
        path.highlight, polygon.highlight, rect.highlight { 
            stroke: var(--accent) !important; 
            stroke-width: 3.5px !important; 
        }
        text.highlight { 
            fill: var(--accent) !important; 
            font-weight: 700 !important; 
        }

        /* Логика скрытия слоев через чекбоксы */
        body.hide-streets [id*="street-"], body.hide-streets [id*="prospekt-"], body.hide-streets [id*="lane-"], body.hide-streets [id*="alleya-"] { opacity: 0 !important; pointer-events: none !important; }
        body.hide-metro [id*="metro-"] { opacity: 0 !important; pointer-events: none !important; }
        body.hide-areas [id*="area-"] { opacity: 0 !important; pointer-events: none !important; }

        /* === АДАПТИВНОСТЬ ПОД МОБИЛЬНЫЕ УСТРОЙСТВА (Менее 768px) === */
@media (max-width: 767px) {
    /* 1. Делаем сайдбар сверху во всю ширину, уменьшаем отступы */
    .sidebar {
        top: 10px;
        left: 10px;
        right: 10px;
        width: auto; /* убираем фиксированные 240px */
        padding: 12px;
        box-sizing: border-box;
    }
    
    /* Перестраиваем фильтры в строчку, чтобы экономить место по высоте */
    .filter-group {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 8px;
    }
    
    .filter-item {
        font-size: 11px;
        background: rgba(0,0,0,0.03);
        padding: 6px 10px;
        border-radius: 20px;
    }

    .zoom-controls {
        margin-top: 10px;
        padding-top: 8px;
    }

    /* 2. Превращаем боковую панель информации в нижнюю шторку (Bottom Sheet) */
    .info-box {
        top: auto; /* отменяем привязку к верху */
        bottom: 0;
        right: 0;
        left: 0;
        width: 100vw; /* во всю ширину смартфона */
        height: 45vh; /* занимает чуть меньше половины экрана по высоте */
        border-left: none;
        border-top: 1px solid rgba(0,0,0,0.08);
        border-radius: 20px 20px 0 0; /* скругление сверху как в нативных приложениях */
        padding: 20px;
        box-shadow: 0 -5px 30px rgba(0,0,0,0.1);
    }

    /* Делаем картинку в шторке поменьше, чтобы оставалось место для текста */
    .info-image-container {
        width: 80px;
        height: 80px;
        float: left; /* пускаем текст в обтекание */
        margin: 0 15px 10px 0;
    }

    .info-box h2 {
        font-size: 14px;
        margin-bottom: 6px;
    }

    .info-box p {
        font-size: 12px;
        text-align: left;
    }
}
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>Управление слоями</h3>
        <div class="filter-group">
            <label class="filter-item"><input type="checkbox" id="check-streets" checked> <span>Улицы</span></label>
            <label class="filter-item"><input type="checkbox" id="check-metro" checked> <span>Станции метро</span></label>
            <label class="filter-item"><input type="checkbox" id="check-areas" checked> <span>Зеленые зоны и площади</span></label>
        </div>
        <div class="zoom-controls">
            <input type="range" id="zoom-slider" class="zoom-slider" min="1.0" max="1.6" step="0.01" value="1.0">
            <span id="zoom-val">100%</span>
        </div>
    </div>

    <div class="info-box" id="info-box">
        <div class="info-image-container">
            <img id="info-img" src="" alt="Локация">
        </div>
        <h2 id="info-title">ЛОКАЦИЯ</h2>
        <p id="info-text">Описание...</p>
    </div>

    <div class="map-container" id="map-canvas">

        // --- ВЕКТОРНЫЙ ДВИЖОК FIGMA-STYLE (НА КООРДИНАТАХ VIEWBOX) ---
        const canvas = document.getElementById('map-canvas');
        const svg = document.getElementById('Nauka');
        const slider = document.getElementById('zoom-slider');
        const zoomVal = document.getElementById('zoom-val');

        const baseWidth = 1920;
        const baseHeight = 1080;

        let currentZoom = 1.0; 
        let viewX = 0;
        let viewY = 0;

        let isPanning = false;
        let startX = 0, startY = 0;

        function applyViewBox() {
            const w = baseWidth / currentZoom;
            const h = baseHeight / currentZoom;
            
            const x = viewX;
            const y = viewY;
            
            svg.setAttribute('viewBox', `${x} ${y} ${w} ${h}`);
            
            slider.value = currentZoom;
            zoomVal.innerText = `${Math.round(currentZoom * 100)}%`;
        }

        // Включение панорамирования по зажатию левой кнопки мыши
        canvas.addEventListener('mousedown', (e) => {
            // Если кликнули на боковые интерфейсы панели, не двигаем холст
            if (e.target.closest('.sidebar') || e.target.closest('.info-box')) return;
            
            isPanning = true;
            startX = e.clientX;
            startY = e.clientY;
        });

        // Движение холста во все стороны
        window.addEventListener('mousemove', (e) => {
            if (!isPanning) return;
            
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            
            // Расчет коэффициента перевода экранных пикселей в систему координат viewBox
            const factor = (baseWidth / svg.clientWidth) / currentZoom;
            
            viewX -= dx * factor;
            viewY -= dy * factor;
            
            startX = e.clientX;
            startY = e.clientY;
            
            applyViewBox();
        });

        // Отпускание мыши глушит перемещение холста
        window.addEventListener('mouseup', () => { 
            isPanning = false; 
        });

        // Небольшой контролируемый зум колесиком (минимум 100%)
        canvas.addEventListener('wheel', (e) => {
            if (e.target.closest('.sidebar') || e.target.closest('.info-box')) return;
            e.preventDefault();
            
            const zoomStep = 0.03;
            let oldZoom = currentZoom;
            
            if (e.deltaY < 0) {
                currentZoom = Math.min(currentZoom + zoomStep, 1.6);
            } else {
                currentZoom = Math.max(currentZoom - zoomStep, 1.0);
            }
            
            if (oldZoom !== currentZoom) {
                const zoomFactor = (1 / oldZoom) - (1 / currentZoom);
                viewX += (baseWidth * zoomFactor) / 2;
                viewY += (baseHeight * zoomFactor) / 2;
                
                if (currentZoom === 1.0) {
                    viewX = 0;
                    viewY = 0;
                }
                applyViewBox();
            }
        }, { passive: false });

        // Синхронизация со слайдером зума
        slider.addEventListener('input', (e) => {
            let oldZoom = currentZoom;
            currentZoom = parseFloat(e.target.value);
            
            const zoomFactor = (1 / oldZoom) - (1 / currentZoom);
            viewX += (baseWidth * zoomFactor) / 2;
            viewY += (baseHeight * zoomFactor) / 2;
            
            if (currentZoom === 1.0) {
                viewX = 0;
                viewY = 0;
            }
            applyViewBox();
        });

        // --- УНИВЕРСАЛЬНЫЙ СИНХРОНИЗАТОР ИДЕНТИФИКАТОРОВ ---
        function getCleanBaseId(rawId) {
            if (!rawId) return "";
            let id = rawId.toLowerCase();
            
            if (id.includes('vavilovykh')) return 'vavilovykh';
            if (id.includes('obruchevykh')) return 'obruchevykh';
            if (id.includes('orbeli')) return 'orbeli';
            if (id.includes('likhacheva')) return 'likhacheva';
            
            if (id.includes('metro-')) {
                if (id.includes('polytechnicheskaya')) return 'metro-polytechnicheskaya';
                if (id.includes('academicheskaya')) return 'metro-academicheskaya';
                if (id.includes('lesnaya')) return 'metro-lesnaya';
            }

            return id.replace(/^label-/, '')
                     .replace(/^area-sad-/, '')
                     .replace(/^area-skver-/, '')
                     .replace(/^area-park-/, '')
                     .replace(/^area-ploshchad-/, '')
                     .replace(/^area-/, '')
                     .replace(/^street-/, '')
                     .replace(/^prospekt-/, '')
                     .replace(/^alleya-/, '')
                     .replace(/-\d+$/, '');
        }

        // --- КЛИКИ, ОТОБРАЖЕНИЕ КАРТОЧКИ СПРАВА И ПОДСВЕТКА СЛОЕВ ---
        const elements = document.querySelectorAll('svg [id]');
        const infoBox = document.getElementById('info-box');
        const infoTitle = document.getElementById('info-title');
        const infoImg = document.getElementById('info-img');
        const infoText = document.getElementById('info-text');

        elements.forEach(el => {
            el.style.cursor = 'pointer';
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                
                const baseId = getCleanBaseId(el.id);
                const data = locationData[baseId];

                if (data) {
                    infoTitle.innerText = data.title;
                    infoText.innerText = data.text;
                    infoImg.src = data.img;
                    infoBox.style.display = 'block';

                    // Тотальный и глубокий перебор всех элементов карты
                    elements.forEach(item => {
                        const itemBaseId = getCleanBaseId(item.id);
                        const hasData = locationData[itemBaseId];

                        if (itemBaseId === baseId) {
                            // Наша активная локация и её подпись горят на 100%
                            item.classList.remove('dimmed');
                            item.classList.add('highlight');
                        } else if (hasData) {
                            // Все остальные семантические полигоны и тексты жестко гаснут
                            item.classList.add('dimmed');
                            item.classList.remove('highlight');
                        }
                    });
                }
            });
        });

        // Сброс при клике по фону холста
        document.addEventListener('click', (e) => {
            if (e.target.closest('.sidebar') || e.target.closest('.info-box')) return;
            elements.forEach(el => el.classList.remove('dimmed', 'highlight'));
            infoBox.style.display = 'none';
        });

        // --- УПРАВЛЕНИЕ СЛОЯМИ ЧЕРЕЗ ЧЕКБОКСЫ ---
        function initLayers() {
            const setupFilter = (checkboxId, bodyClassName) => {
                const box = document.getElementById(checkboxId);
                if (box) {
                    box.addEventListener('change', (e) => {
                        document.body.classList.toggle(bodyClassName, !e.target.checked);
                    });
                    document.body.classList.toggle(bodyClassName, !box.checked);
                }
            };
            setupFilter('check-streets', 'hide-streets');
            setupFilter('check-metro', 'hide-metro');
            setupFilter('check-areas', 'hide-areas');
            
            applyViewBox();
        } 
        // =================================================================
        // МОБИЛЬНЫЙ ДВИЖОК: ПЕРЕМЕЩЕНИЕ И ПЛАВНЫЙ ЗУМ (POINTER EVENTS)
        // =================================================================
        let viewBox = { x: 0, y: 0, w: 2364, h: 1726 }; 
        const baseW = 2364;
        const baseH = 1726;

        let activePointers = []; 
        let isDragging = false;
        let startPoint = { x: 0, y: 0 };
        let totalMovedDistance = 0; 

        let initialPinchDistance = 0;
        let initialViewBoxW = 0;
        let initialViewBoxH = 0;
        let initialViewBoxCenterX = 0;
        let initialViewBoxCenterY = 0;

        function updateSVGViewBox() {
            if(svg) svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
        }

        if (svg) {
            svg.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.sidebar') || e.target.closest('.info-box')) return;
                
                activePointers.push(e);
                svg.setPointerCapture(e.pointerId); 

                if (activePointers.length === 1) {
                    isDragging = true;
                    startPoint = { x: e.clientX, y: e.clientY };
                    totalMovedDistance = 0; 
                } else if (activePointers.length === 2) {
                    isDragging = false;
                    initialPinchDistance = Math.hypot(activePointers[1].clientX - activePointers[0].clientX, activePointers[1].clientY - activePointers[0].clientY);
                    initialViewBoxW = viewBox.w;
                    initialViewBoxH = viewBox.h;

                    const centerX = (activePointers[0].clientX + activePointers[1].clientX) / 2;
                    const centerY = (activePointers[0].clientY + activePointers[1].clientY) / 2;
                    const rect = svg.getBoundingClientRect();
                    const touchXPercent = (centerX - rect.left) / rect.width;
                    const touchYPercent = (centerY - rect.top) / rect.height;

                    initialViewBoxCenterX = viewBox.x + initialViewBoxW * touchXPercent;
                    initialViewBoxCenterY = viewBox.y + initialViewBoxH * touchYPercent;
                }
            });

            svg.addEventListener('pointermove', (e) => {
                if (e.target.closest('.sidebar') || e.target.closest('.info-box')) return;

                const index = activePointers.findIndex(p => p.pointerId === e.pointerId);
                if (index !== -1) activePointers[index] = e;

                if (isDragging && activePointers.length === 1) {
                    const rect = svg.getBoundingClientRect();
                    const factorX = viewBox.w / rect.width;
                    const factorY = viewBox.h / rect.height;
                    const dx = (e.clientX - startPoint.x) * factorX;
                    const dy = (e.clientY - startPoint.y) * factorY;

                    totalMovedDistance += Math.hypot(e.clientX - startPoint.x, e.clientY - startPoint.y);

                    viewBox.x -= dx;
                    viewBox.y -= dy;
                    startPoint = { x: e.clientX, y: e.clientY };
                    updateSVGViewBox();
                } else if (activePointers.length === 2) {
                    const currentDistance = Math.hypot(activePointers[1].clientX - activePointers[0].clientX, activePointers[1].clientY - activePointers[0].clientY);
                    if (initialPinchDistance === 0) return;

                    const scaleFactor = initialPinchDistance / currentDistance;

                    let newW = initialViewBoxW * scaleFactor;
                    let newH = initialViewBoxH * scaleFactor;

                    if (newW < 150) { newW = 150; newH = newW * (initialViewBoxH / initialViewBoxW); }
                    if (newW > baseW * 3) { newW = baseW * 3; newH = newW * (initialViewBoxH / initialViewBoxW); }

                    const rect = svg.getBoundingClientRect();
                    const centerX = (activePointers[0].clientX + activePointers[1].clientX) / 2;
                    const centerY = (activePointers[0].clientY + activePointers[1].clientY) / 2;
                    const touchXPercent = (centerX - rect.left) / rect.width;
                    const touchYPercent = (centerY - rect.top) / rect.height;

                    viewBox.w = newW;
                    viewBox.h = newH;
                    viewBox.x = initialViewBoxCenterX - newW * touchXPercent;
                    viewBox.y = initialViewBoxCenterY - newH * touchYPercent;
                    updateSVGViewBox();
                }
            });

            const stopTracking = (e) => {
                activePointers = activePointers.filter(p => p.pointerId !== e.pointerId);
                if (activePointers.length < 2) initialPinchDistance = 0;
                if (activePointers.length === 0) isDragging = false;
            };

            svg.addEventListener('pointerup', stopTracking);
            svg.addEventListener('pointercancel', stopTracking);
            svg.addEventListener('pointerleave', stopTracking);
        }

        window.addEventListener('DOMContentLoaded', initLayers);

        // Блокировка правой кнопки мыши (контекстного меню)
    document.addEventListener('contextmenu', event => event.preventDefault());

    // Блокировка F12, Ctrl+Shift+I, Ctrl+Shift+C, Ctrl+U
    document.addEventListener('keydown', function(event) {
        if (event.keyCode == 123) { // F12
            event.preventDefault();
            return false;
        }
        if (event.ctrlKey && event.shiftKey && (event.keyCode == 73 || event.keyCode == 67)) { // Ctrl+Shift+I или Ctrl+Shift+C
            event.preventDefault();
            return false;
        }
        if (event.ctrlKey && event.keyCode == 85) { // Ctrl+U (Просмотр исходного кода)
            event.preventDefault();
            return false;
        }
    });

    setInterval(function() {
        debugger;
    }, 100);
    </script>
